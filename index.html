const api = {
  async fetchProducts({ category, sort } = {}) {
    await new Promise(r => setTimeout(r, 500));
    let list = [...PRODUCTS];
    if (category && category !== 'همه') list = list.filter(p => p.category === category);
    if (sort === 'price-asc') list.sort((a,b) => a.price - b.price);
    if (sort === 'price-desc') list.sort((a,b) => b.price - a.price);
    if (sort === 'new') list = list.filter(p=>p.isNew).concat(list.filter(p=>!p.isNew));
    return list;
  },
  async search(q) {
    if (!q) return [];
    return PRODUCTS.filter(p => p.name.includes(q)).slice(0, 5);
  },
};

// Context: سبد خرید
const CartContext = createContext(null);
function CartProvider({ children }) {
  const [items, setItems] = useState([]);
  function addItem(product, { size, color, qty = 1 }) {
    setItems(prev => {
      const key = product.id + '-' + size + '-' + color;
      const existing = prev.find(i => i.key === key);
      if (existing) return prev.map(i => i.key === key ? { ...i, qty: i.qty + qty } : i);
      return [...prev, { key, id: product.id, name: product.name, price: product.price, image: product.images[0], size, color, qty }];
    });
  }
  function removeItem(key) { setItems(prev => prev.filter(i => i.key !== key)); }
  function updateQty(key, qty) { setItems(prev => prev.map(i => i.key === key ? { ...i, qty: Math.max(1, qty) } : i)); }
  function clearCart() { setItems([]); }
  const total = useMemo(() => items.reduce((s,i) => s + i.price*i.qty, 0), [items]);
  const count = useMemo(() => items.reduce((s,i) => s + i.qty, 0), [items]);
  return <CartContext.Provider value={{ items, addItem, removeItem, updateQty, clearCart, total, count }}>{children}</CartContext.Provider>;
}
const useCart = () => useContext(CartContext);

const WishlistContext = createContext(null);
function WishlistProvider({ children }) {

  function has(id) { return ids.includes(id); }
  return <WishlistContext.Provider value={{ ids, toggle, has }}>{children}</WishlistContext.Provider>;
}

// پارالاکس سبک برای بخش‌های مختلف
function Parallax({ children, speed = 0.08, className }) {
  const ref = useRef(null);
  const [offset, setOffset] = useState(0);
  useEffect(() => {
    let ticking = false;
    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const el = ref.current;
        if (el) {
          const rect = el.getBoundingClientRect();
          const center = rect.top + rect.height / 2 - window.innerHeight / 2;
          setOffset(center * speed * -1);
        }
        ticking = false;
      });
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, [speed]);
  return <div ref={ref} className={className} style={{ transform: 'translateY(' + offset + 'px)' }}>{children}</div>;
}

function ScrollProgressBar() {
  const [pct, setPct] = useState(0);
  useEffect(() => {
    let ticking = false;
    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const h = document.documentElement.scrollHeight - window.innerHeight;
        setPct(h > 0 ? Math.min(100, (window.scrollY / h) * 100) : 0);
        ticking = false;
      });
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (

// کرسور سفارشی
function CustomCursor() {
  const dotRef = useRef(null);
  const ringRef = useRef(null);
  useEffect(() => {
    function onMove(e) {
      if (dotRef.current) { dotRef.current.style.left = e.clientX + 'px'; dotRef.current.style.top = e.clientY + 'px'; }
      if (ringRef.current) { ringRef.current.style.left = e.clientX + 'px'; ringRef.current.style.top = e.clientY + 'px'; }
    }
    function onOver(e) {
      const hoverable = e.target.closest && e.target.closest('a,button,[data-cursor-hover]');
      if (ringRef.current) ringRef.current.classList.toggle('scale-150', !!hoverable);
      if (ringRef.current) ringRef.current.classList.toggle('border-gold', !!hoverable);
    }
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseover', onOver);
    return () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseover', onOver); };
  }, []);
  return (
    <div className="hidden md:block">
      <div ref={dotRef} className="fixed top-0 left-0 w-1.5 h-1.5 rounded-full bg-gold -translate-x-1/2 -translate-y-1/2 pointer-events-none z-[100]"></div>
      <div ref={ringRef} className="fixed top-0 left-0 w-8 h-8 rounded-full border border-violet-soft/60 -translate-x-1/2 -translate-y-1/2 pointer-events-none z-[100] transition-[transform,border-color] duration-300 ease-out"></div>
    </div>
  );
}

// دکمه مغناطیسی
function Magnetic({ children, strength = 16 }) {
  const ref = useRef(null);
  function handleMove(e) {
    const el = ref.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const x = e.clientX - rect.left - rect.width / 2;
    const y = e.clientY - rect.top - rect.height / 2;
    el.style.transform = 'translate(' + (x / rect.width * strength) + 'px,' + (y / rect.height * strength) + 'px)';
  }
  function reset() { if (ref.current) ref.current.style.transform = 'translate(0,0)'; }
  return React.cloneElement(children, {
    ref,
    onMouseMove: (e) => { handleMove(e); children.props.onMouseMove && children.props.onMouseMove(e); },
    onMouseLeave: (e) => { reset(); children.props.onMouseLeave && children.props.onMouseLeave(e); },
    style: { ...(children.props.style || {}), transition: 'transform 300ms cubic-bezier(.16,1,.3,1)', display: 'inline-block' },
  });
}

// ورود پله‌پله‌ای هنگام اسکرول
function Reveal({ children, delay = 0, className }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) { setVisible(true); obs.unobserve(el); } });
    }, { threshold: 0.12 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return (
    <div ref={ref} className={className} style={{
      transition: 'opacity 750ms cubic-bezier(.16,1,.3,1), transform 750ms cubic-bezier(.16,1,.3,1)',
      transitionDelay: delay + 'ms',
      opacity: visible ? 1 : 0,
      transform: visible ? 'translateY(0) scale(1)' : 'translateY(26px) scale(0.94)',
    }}>
      {children}
    </div>
  );
}

function ProductCard({ product, onOpen, index, featured, aspectClass }) {
  const ref = useRef(null);
  const [style, setStyle] = useState({});
  const { addItem } = useCart();
  const { has, toggle } = useWishlist();
  const { show: showQuickView } = useQuickView();
  const { push } = useToast();
  const [justAdded, setJustAdded] = useState(false);
  const [activeImg, setActiveImg] = useState(0);
  const [activeColor, setActiveColor] = useState(product.colors[0]);
  const liked = has(product.id);
  const stock = mockStock(product.id);

  function handleMove(e) {
    const rect = ref.current.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width - 0.5;
    const py = (e.clientY - rect.top) / rect.height - 0.5;
    setStyle({ transform: 'perspective(1100px) rotateY(' + (px*-3.5) + 'deg) rotateX(' + (py*3.5) + 'deg) translateY(-3px)' });
  }
  function reset() { setStyle({ transform: 'perspective(900px) rotateY(0) rotateX(0) translateY(0)' }); }

  function quickAdd(e) {
    e.stopPropagation();
    addItem(product, { size: product.sizes[0], color: activeColor, qty: 1 });
    setJustAdded(true);
    push(product.name + ' به سبد اضافه شد');
    setTimeout(() => setJustAdded(false), 1400);
  }

  const hoverImg = product.images[(activeImg + 1) % product.images.length] || product.images[activeImg];
  const isDefaultColor = activeColor === product.colors[0];

  return (
    <div
      ref={ref}
      data-cursor-hover
      onMouseMove={handleMove}
      onMouseLeave={reset}
      style={style}
      className="tilt-card group cursor-pointer relative hover:z-20"

        <div className="absolute top-3 right-3 flex gap-2">

// زوم عکس محصول
function ZoomImage({ src }) {
  const ref = useRef(null);
  const [show, setShow] = useState(false);
  const [lens, setLens] = useState({ x: 0, y: 0 });
  const [bgPos, setBgPos] = useState('50% 50%');
  const lensSize = 180;
  const zoom = 2.4;

  function handleMove(e) {
    const rect = ref.current.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;
    setBgPos(((x/rect.width)*100) + '% ' + ((y/rect.height)*100) + '%');
    x = Math.max(lensSize/2, Math.min(rect.width - lensSize/2, x));
    y = Math.max(lensSize/2, Math.min(rect.height - lensSize/2, y));
    setLens({ x, y });
  }

  return (
    <div
      ref={ref}
      onMouseMove={handleMove}
      onMouseEnter={() => setShow(true)}
      onMouseLeave={() => setShow(false)}
      className="relative aspect-[3/4] rounded-3xl overflow-hidden bg-surface2 border border-line md:cursor-none shadow-card"
    >
      <img src={src} alt="" className="w-full h-full object-cover" />
      <div className={"absolute inset-0 bg-void/0 transition-opacity duration-300 " + (show ? 'md:bg-void/30' : '')}></div>
      {show && (
        <div
          className="hidden md:block absolute rounded-full pointer-events-none z-[110]"
          style={{
            width: lensSize, height: lensSize,
            left: lens.x - lensSize/2, top: lens.y - lensSize/2,
            backgroundImage: 'url(' + src + ')',
            backgroundSize: (zoom*100) + '%',
            backgroundPosition: bgPos,
            backgroundRepeat: 'no-repeat',
            boxShadow: '0 0 0 2px #D4AF6A, 0 0 40px rgba(0,0,0,0.5), inset 0 0 30px rgba(0,0,0,0.15)',
          }}
        ></div>
      )}
    </div>
  );
}

function Checkout({ goHome }) {
  const STEPS = ['آدرس', 'پرداخت', 'تایید نهایی'];
  const { items, total, clearCart } = useCart();
  const { push } = useToast();
  const [done, setDone] = useState(false);
  const addrRef = useRef(null), payRef = useRef(null), confirmRef = useRef(null);
  const refs = [addrRef, payRef, confirmRef];
  const [active, setActive] = useState(0);
  const [form, setForm] = useState({ name: '', phone: '', address: '' });
  const [errors, setErrors] = useState({});

  function updateForm(key, value) {
    setForm(prev => ({ ...prev, [key]: value }));
    if (errors[key]) setErrors(prev => ({ ...prev, [key]: false }));
  }

  function handleSubmit() {
    const nextErrors = {
      name: form.name.trim().length < 2,
      phone: !/^0?9\d{9}$/.test(form.phone.trim()),
      address: form.address.trim().length < 8,
    };
    setErrors(nextErrors);
    if (Object.values(nextErrors).some(Boolean)) {
      push('لطفاً اطلاعات آدرس رو کامل و درست وارد کنید', 'error');
      addrRef.current && addrRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    setDone(true);
    push('سفارش با موفقیت ثبت شد ✓');
    clearCart();
  }

  useEffect(() => {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const idx = refs.findIndex(r => r.current === entry.target);
          if (idx !== -1) setActive(idx);
        }
      });
    }, { threshold: 0.4, rootMargin: '-110px 0px -35% 0px' });
    refs.forEach(r => r.current && observer.observe(r.current));
    return () => observer.disconnect();
  }, []);

  if (items.length === 0 && !done) {
    return <div className="max-w-xl mx-auto px-4 py-24 text-center animate-fadeUp"><p className="text-muted mb-4">سبد خرید شما خالی است.</p><button onClick={goHome} className="text-gold underline-grow">بازگشت به فروشگاه</button></div>;
  }

  if (done) {
    return (
      <div className="max-w-xl mx-auto px-4 py-24 text-center animate-scaleIn">
        <div className="w-16 h-16 rounded-full bg-gradient-to-l from-violet to-gold flex items-center justify-center text-void text-2xl mx-auto mb-6">✓</div>
        <p className="text-2xl font-black font-display text-gradient mb-3">سفارش ثبت شد</p>
        <p className="text-muted mb-8">پیامک تایید برای شما ارسال خواهد شد.</p>
        <button onClick={goHome} className="btn-primary px-8 py-3 rounded-xl text-void font-bold inline-block"><span>بازگشت به فروشگاه</span></button>
      </div>
    );
  }

  return (
    <div className="max-w-6xl mx-auto px-4 md:px-6 py-12 md:py-16 pb-28 lg:pb-16 animate-fadeUp grid lg:grid-cols-[1fr_360px] gap-10 items-start">
      <div>
        <div className="sticky top-16 z-20 -mx-4 px-4 md:mx-0 md:px-0 bg-void/85 backdrop-blur-md pb-6 pt-2">
          <Stepper steps={STEPS} step={active} />
        </div>

        <section ref={addrRef} className="glass border border-line rounded-3xl p-7 md:p-8 mb-8" style={{ scrollMarginTop: '8rem' }}>
          <h2 className="font-bold mb-5 text-lg flex items-center gap-2">
            <span className="w-6 h-6 rounded-full bg-gradient-to-l from-violet to-gold text-void text-xs flex items-center justify-center font-bold">۱</span>
            آدرس تحویل
          </h2>
          <div className="flex flex-col gap-4">
            <FloatInput label="نام و نام خانوادگی" value={form.name} onChange={e => updateForm('name', e.target.value)} error={errors.name} />
            <FloatInput label="شماره موبایل" value={form.phone} onChange={e => updateForm('phone', e.target.value)} error={errors.phone} type="tel" dir="ltr" />
            <div className="relative">
              <textarea placeholder=" " rows="3" value={form.address} onChange={e => updateForm('address', e.target.value)} className={"peer w-full bg-surface2 border rounded-xl px-4 pt-6 pb-2.5 outline-none transition-colors " + (errors.address ? 'border-red-500/70 focus:border-red-500' : 'border-line focus:border-violet')}></textarea>
              <label className="absolute right-4 top-4 text-muted text-sm transition-all peer-focus:top-2 peer-focus:text-[11px] peer-focus:text-violet-soft peer-[:not(:placeholder-shown)]:top-2 peer-[:not(:placeholder-shown)]:text-[11px]">آدرس کامل</label>
            </div>
          </div>
        </section>

        <section ref={payRef} className="glass border border-line rounded-3xl p-7 md:p-8 mb-8" style={{ scrollMarginTop: '8rem' }}>
          <h2 className="font-bold mb-5 text-lg flex items-center gap-2">
            <span className="w-6 h-6 rounded-full bg-gradient-to-l from-violet to-gold text-void text-xs flex items-center justify-center font-bold">۲</span>
            روش پرداخت
          </h2>
          <div className="flex flex-col gap-3">
            <label className="flex items-center gap-3 border border-line rounded-xl px-4 py-4 cursor-pointer hover:border-violet transition-colors has-[:checked]:border-gold has-[:checked]:bg-white/[0.03]">
              <input type="radio" name="pay" defaultChecked className="accent-gold" /> درگاه بانکی آنلاین
            </label>
            <label className="flex items-center gap-3 border border-line rounded-xl px-4 py-4 cursor-pointer hover:border-violet transition-colors has-[:checked]:border-gold has-[:checked]:bg-white/[0.03]">
              <input type="radio" name="pay" className="accent-gold" /> پرداخت ارز دیجیتال
            </label>
          </div>
        </section>

        <section ref={confirmRef} className="glass border border-line rounded-3xl p-7 md:p-8" style={{ scrollMarginTop: '8rem' }}>
          <h2 className="font-bold mb-5 text-lg flex items-center gap-2">
            <span className="w-6 h-6 rounded-full bg-gradient-to-l from-violet to-gold text-void text-xs flex items-center justify-center font-bold">۳</span>
            تایید نهایی
          </h2>
          <div className="divide-y divide-line">{items.map(i => <div key={i.key} className="flex justify-between py-3 text-sm"><span className="text-muted">{i.name} × {i.qty}</span><span>{(i.price*i.qty).toLocaleString('fa-IR')}</span></div>)}</div>
        </section>
      </div>

      <aside className="lg:sticky lg:top-24 glass border border-line rounded-3xl p-6">
        <p className="text-[11px] tracking-widest2 text-faint uppercase mb-4">خلاصه سفارش</p>
        <div className="flex flex-col gap-3 mb-5 max-h-64 overflow-y-auto">
          {items.map(i => (
            <div key={i.key} className="flex items-center gap-3">
              <img loading="lazy" src={i.image} alt={i.name} className="w-12 h-12 rounded-lg object-cover shrink-0" />
              <div className="flex-1 min-w-0"><p className="text-sm truncate">{i.name}</p><p className="text-xs text-muted">{i.size} × {i.qty}</p></div>
              <span className="text-xs text-gold shrink-0">{(i.price*i.qty).toLocaleString('fa-IR')}</span>
            </div>
          ))}
        </div>
        <div className="border-t border-line pt-4 mb-5">
          <div className="flex justify-between text-sm mb-2"><span className="text-muted">جمع کالاها</span><span>{total.toLocaleString('fa-IR')}</span></div>
          <div className="flex justify-between text-sm mb-2"><span className="text-muted">ارسال</span><span className="text-violet-soft">رایگان</span></div>
          <div className="flex justify-between font-bold text-lg pt-2 border-t border-line mt-2"><span>جمع کل</span><span className="text-gold">{toman(total)}</span></div>
        </div>
        <Magnetic><button onClick={handleSubmit} className="btn-primary w-full py-3.5 rounded-xl text-void font-bold"><span>ثبت نهایی سفارش</span></button></Magnetic>
      </aside>

      <div className="lg:hidden fixed bottom-0 inset-x-0 z-30 glass border-t border-line p-4 flex items-center justify-between gap-4">
        <div><p className="text-[11px] text-faint">جمع کل</p><p className="text-gold font-bold">{toman(total)}</p></div>
        <button onClick={handleSubmit} className="btn-primary flex-1 max-w-[200px] py-3 rounded-xl text-void font-bold text-sm"><span>ثبت نهایی سفارش</span></button>

function Hero() {
  const ref = useRef(null);

  const textRef = useRef(null);
  const imgRef = useRef(null);
  const blobARef = useRef(null);
  const blobBRef = useRef(null);
  useEffect(() => {
    let ticking = false;
    function apply() {
      const y = window.scrollY;
      const fade = Math.max(0, 1 - y / 480);
      if (contentRef.current) contentRef.current.style.opacity = fade;
      if (textRef.current) textRef.current.style.transform = 'translateX(' + (y*0.22) + 'px)';
      if (imgRef.current) imgRef.current.style.transform = 'scale(' + (1 + y*0.0007) + ') translateY(' + (y*0.04) + 'px)';
      if (blobARef.current) blobARef.current.style.transform = 'translateY(' + (y*0.35) + 'px)';
      if (blobBRef.current) blobBRef.current.style.transform = 'translateY(' + (y*0.2) + 'px)';
      ticking = false;
    }
    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(apply);
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    apply();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  function handleMove(e) {
    const rect = ref.current.getBoundingClientRect();
    ref.current.style.setProperty('--x', ((e.clientX-rect.left)/rect.width*100)+'%');
    ref.current.style.setProperty('--y', ((e.clientY-rect.top)/rect.height*100)+'%');
  }
  const words = 'پوشاکی برای شب‌هایی که رنگ خودشون رو دارن'.split(' ');
  return (
    <section

      <div ref={contentRef} className="relative max-w-7xl mx-auto px-4 md:px-6 pt-16 pb-14 md:pt-24 md:pb-20 grid lg:grid-cols-2 gap-10 items-center">

// پنل‌های اسکرول‌محور افقی — کالکشن‌های ویژه
function ScrollShowcase() {
  const wrapRef = useRef(null);
  const trackRef = useRef(null);
  const targetRef = useRef(0);
  const currentRef = useRef(0);
  const panels = [
    { t: 'کالکشن اکلیپس', d: 'هودی و بیرونی‌های تیره برای شب‌های بلند شهر.', img: CATEGORY_IMG['هودی'] },
    { t: 'خط وویدلاین', d: 'شلوارهای کارگو با برش‌های فانکشنال و پارچه سنگین.', img: CATEGORY_IMG['شلوار'] },
    { t: 'گلدلاین', d: 'اکسسوری‌های طلایی برای تکمیل استایل شب.', img: CATEGORY_IMG['اکسسوری'] },
  ];
  useEffect(() => {
    let raf = null;
    let scrollTicking = false;

    function measure() {
      const el = wrapRef.current;
      if (el) {
        const rect = el.getBoundingClientRect();
        const total = el.offsetHeight - window.innerHeight;
        const scrolled = Math.min(Math.max(-rect.top, 0), Math.max(total, 1));
        targetRef.current = total > 0 ? scrolled / total : 0;
      }
      ensureLoop();
    }

    function tick() {
      currentRef.current += (targetRef.current - currentRef.current) * 0.15;
      if (trackRef.current) {
        trackRef.current.style.transform = 'translateX(' + (-currentRef.current * (panels.length - 1) * 100) + 'vw)';
      }
      if (Math.abs(targetRef.current - currentRef.current) > 0.001) {
        raf = requestAnimationFrame(tick);
      } else {
        raf = null;
      }
    }

    function ensureLoop() {
      if (raf === null) raf = requestAnimationFrame(tick);
    }

    function onScroll() {
      if (scrollTicking) return;
      scrollTicking = true;
      requestAnimationFrame(() => { measure(); scrollTicking = false; });
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    measure();
    return () => { window.removeEventListener('scroll', onScroll); if (raf) cancelAnimationFrame(raf); };
  }, []);

  return (
    <section ref={wrapRef} style={{ height: (panels.length * 85) + 'vh' }} className="relative">
      <div className="sticky top-0 h-screen overflow-hidden border-y border-line">
        <div ref={trackRef} className="flex h-full will-change-transform">
          {panels.map((p, i) => (
            <div key={p.t} className="relative h-full shrink-0" style={{ width: '100vw' }}>
              <img loading="lazy" src={p.img} alt={p.t} className="absolute inset-0 w-full h-full object-cover" />
              <div className="absolute inset-0 bg-gradient-to-t from-void via-void/50 to-void/10"></div>
              <div className="noise"></div>
              <div className="relative h-full max-w-7xl mx-auto px-6 md:px-10 flex flex-col justify-end pb-20">
                <p className="text-[11px] tracking-widest2 text-gold mb-3 uppercase">کالکشن ویژه — {i+1}/{panels.length}</p>
                <h3 className="text-3xl md:text-6xl font-black font-display mb-4 max-w-lg leading-tight">{p.t}</h3>
                <p className="text-muted max-w-sm">{p.d}</p>
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

                <Reveal key={p.id} delay={(i%8)*50}>
                  <ProductListRow product={p} onOpen={onOpenProduct} onPreview={handlePreview} />
                </Reveal>
              ))}
            </div>
          )}
        </div>
      </section>

      <HoverPreview product={previewProduct} pos={previewPos} />
    </div>
  );
}

// اپ اصلی
function App() {
  const [page, setPage] = useState('home');
  const [productId, setProductId] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);
  const [cartOpen, setCartOpen] = useState(false);
  const [filterOpen, setFilterOpen] = useState(false);
  const [category, setCategory] = useState('همه');
  const [sort, setSort] = useState('');
  const [showIntro, setShowIntro] = useState(true);

  useEffect(() => {
    const t = setTimeout(() => setShowIntro(false), 1300);
    return () => clearTimeout(t);
  }, []);

  const [transitioning, setTransitioning] = useState(false);
  function navigate(fn, scrollTargetId) {
    setTransitioning(true);
    setTimeout(() => {
      fn();
      requestAnimationFrame(() => {
        const el = scrollTargetId && document.getElementById(scrollTargetId);
        if (el) el.scrollIntoView({ block: 'start' });
        else window.scrollTo(0, 0);
        setTransitioning(false);
      });
    }, 320);
  }

  const goHome = () => navigate(() => setPage('home'));
  const goAccount = () => navigate(() => setPage('account'));
  const goCheckout = () => navigate(() => setPage('checkout'));
  const openProduct = (id) => navigate(() => { setProductId(id); setPage('product'); });
  const goCategory = (cat) => navigate(() => { setCategory(cat); setPage('home'); }, 'grid');
  const goPage = (key) => navigate(() => setPage(key));

  return (
    <CartProvider>
    <WishlistProvider>
    <QuickViewProvider>
    <ToastProvider>
      <div className="min-h-screen bg-void text-ink font-sans">
        <CustomCursor />
        <ScrollProgressBar />
        <IntroSplash show={showIntro} />
        <div className={"fixed inset-0 z-[90] bg-void pointer-events-none transition-opacity duration-300 " + (transitioning ? 'opacity-100' : 'opacity-0')}></div>
        {transitioning && (
          <div className="fixed inset-0 z-[91] flex items-center justify-center pointer-events-none">
            <span className="text-gradient font-black font-display text-2xl tracking-widest2 animate-pulse">VOIDWEAR</span>
          </div>
        )}
        <Header setMenuOpen={setMenuOpen} setCartOpen={setCartOpen} goHome={goHome} goToProduct={openProduct} goAccount={goAccount} page={page} />
        <main key={page}>
          {page === 'home' && <Home category={category} setCategory={setCategory} sort={sort} setSort={setSort} setFilterOpen={setFilterOpen} onOpenProduct={openProduct} />}
          {page === 'product' && <ProductDetail id={productId} setCartOpen={setCartOpen} onOpen={openProduct} />}
          {page === 'checkout' && <Checkout goHome={goHome} />}
          {page === 'account' && <Account onOpen={openProduct} />}
          {page === 'faq' && <FAQPage />}
          {page === 'sizeguide' && <SizeGuidePage />}
          {page === 'shipping' && <ShippingPage />}
          {page === 'contact' && <ContactPage />}
        </main>
        <Footer goHome={goHome} goCategory={goCategory} goPage={goPage} />
        <DrawerMenu open={menuOpen} setOpen={setMenuOpen} goCategory={goCategory} goHome={goHome} />
        <FilterDrawer open={filterOpen} setOpen={setFilterOpen} category={category} setCategory={setCategory} sort={sort} setSort={setSort} />
        <CartDrawer open={cartOpen} setOpen={setCartOpen} goCheckout={goCheckout} />
        <QuickViewModal onOpen={openProduct} />
      </div>
    </ToastProvider>
    </QuickViewProvider>
    </WishlistProvider>
    </CartProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
